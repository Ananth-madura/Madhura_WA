import express from 'express';
import dotenv from 'dotenv';
dotenv.config();

const app = express();
app.use(express.json());

const TOKEN = process.env.WHATSAPP_TOKEN;
const PHONE_ID = process.env.PHONE_NUMBER_ID;
const VERIFY_TOKEN = process.env.VERIFY_TOKEN || "foodtrader_verify_123";

// --- Helper: Send Any Interactive Message ---
async function sendMessage(to, payload) {
  const url = \`https://graph.facebook.com/v20.0/\${PHONE_ID}/messages\`;
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Authorization": \`Bearer \${TOKEN}\`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      messaging_product: "whatsapp",
      to,
      ...payload
    })
  });
  const data = await res.json();
  console.log("Send result:", data);
  return data;
}

// --- Webhook Verification (GET) ---
app.get("/webhook", (req, res) => {
  const mode = req.query["hub.mode"];
  const token = req.query["hub.verify_token"];
  const challenge = req.query["hub.challenge"];
  if (mode === "subscribe" && token === VERIFY_TOKEN) {
    console.log("WEBHOOK VERIFIED");
    res.status(200).send(challenge);
  } else {
    res.sendStatus(403);
  }
});

// --- Webhook Receiver (POST) - Handle button clicks ---
app.post("/webhook", async (req, res) => {
  const body = req.body;
  if (body.object) {
    const entry = body.entry?.[0];
    const change = entry?.changes?.[0];
    const value = change?.value;
    const message = value?.messages?.[0];

    if (message) {
      const from = message.from; // customer phone
      const type = message.type;

      // Button reply
      if (type === "interactive") {
        const interactive = message.interactive;
        if (interactive.type === "button_reply") {
          const btnId = interactive.button_reply.id;
          console.log(\`Button clicked: \${btnId} by \${from}\`);

          if (btnId === "view_menu") {
            await sendMessage(from, {
              type: "interactive",
              interactive: {
                type: "list",
                body: { text: "Choose category" },
                action: { button: "View Categories", sections: [...] }
              }
            });
          } else if (btnId === "my_orders") {
            await sendMessage(from, { type: "text", text: { body: "Your last order #FT-1023 is out for delivery \uD83D\uDE9A" } });
          }
        }
        // List reply
        if (interactive.type === "list_reply") {
          const listId = interactive.list_reply.id;
          console.log("List selected:", listId);
          // send products based on listId...
        }
      }

      // Regular text
      if (type === "text") {
        console.log("Text from", from, ":", message.text.body);
        // Trigger your automation flow here
      }
    }
    res.sendStatus(200);
  } else {
    res.sendStatus(404);
  }
