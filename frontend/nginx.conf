worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # WhatsApp Web session pairing and QR generation are slow, and the backend
    # holds long-lived sockets for Socket.IO. Generous timeouts so nginx does
    # not cut a QR render or a live chat mid-request.
    proxy_connect_timeout 180s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── Static assets ──────────────────────────────────────
        # Content-hashed filenames, so these can be cached indefinitely.
        location /static/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Backend proxy ──────────────────────────────────────
        # NOTE on proxy_pass: the trailing URI is load-bearing. Writing
        # `proxy_pass http://backend:5000/;` would REPLACE the matched
        # `/api/` prefix, so /api/auth/login would reach the backend as
        # /auth/login — and every backend route is mounted under /api.
        # Omitting the URI (as below) forwards the original path untouched.

        location /api/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend-served static files (invoice PDFs, generated documents).
        location /uploads/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Socket.IO. Long read timeout or the connection is reaped mid-chat.
        location /socket.io/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Liveness probe target, matching the /health rewrite in vercel.json.
        location = /health {
            proxy_pass http://backend:5000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── SPA fallback ───────────────────────────────────────
        # Must stay last: client-side routing owns every other path.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # The HTML shell must never be cached, or a deploy never reaches users.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Same for the service worker, or a new one can never ship.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        location = /manifest.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Never serve dotfiles (.env, .git, editor swap files).
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=(), payment=()" always;
    }
}
