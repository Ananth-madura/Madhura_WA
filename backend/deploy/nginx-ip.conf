# =============================================================================
#  IP-only workspace: http://187.127.215.13/ serves the app AND the API.
#
#  Install with:
#      cd /home/wauser/app/backend && sudo bash deploy/install-ip-site.sh
#
#  Why this exists: the domain path needs DNS, a certificate and a proxy vhost.
#  This block needs none of them. The browser only ever talks to port 80 on the
#  address it typed, `/api` is proxied to the Node app on loopback, and because
#  the API is same-origin there is no CORS preflight and no mixed-content block.
#  Port 5001 stays closed to the internet.
#
#  server_name is the literal address, so this block wins over a hosting panel's
#  catch-all/default server for requests whose Host header is the IP.
#
#  Defaults below are the values install-ip-site.sh rewrites from
#  IP_ADDRESS / API_PORT / FRONTEND_ROOT; keep the exact spelling if you edit.
# =============================================================================

server {
    listen 80;
    server_name 187.127.215.13;

    client_max_body_size 50m;
    root /home/wauser/app/frontend/build;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # No HSTS here on purpose: this vhost is plain HTTP, and sending HSTS for the
    # bare IP would break every future https:// attempt on it.

    # ---- API: same origin, so the browser never needs :5001 or CORS ----------
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Meta and provider callbacks stay on the same public port.
    location /webhook {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inbound WhatsApp media and generated invoices/documents.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # Socket.IO. Long read timeout or a live chat is reaped mid-conversation.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Workspace build ----------------------------------------------------
    # Content-hashed filenames: safe to cache for a year.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell and the service worker must never be cached, or a deploy of the
    # IP site never reaches the browser.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Never serve dotfiles (.env, .git, swap files) if they end up in the root.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
