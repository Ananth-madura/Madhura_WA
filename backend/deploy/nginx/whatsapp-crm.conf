# ============================================================================
#  Nginx site — Whatsapp_CRM backend (Hostinger VPS)
#
#  Replace every occurrence of api.example.com with your real domain.
#  The frontend lives on Vercel and reaches this server through these rewrites:
#      /api/*       -> https://api.example.com/api/*
#      /uploads/*   -> https://api.example.com/uploads/*
#      /socket.io/* -> https://api.example.com/socket.io/*
#
#  Install:
#    sudo cp deploy/nginx/whatsapp-crm.conf /etc/nginx/sites-available/whatsapp-crm
#    sudo ln -s /etc/nginx/sites-available/whatsapp-crm /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Certificate:
#    sudo certbot --nginx -d api.example.com
#    (certbot rewrites this file to add the TLS block and the redirect)
# ============================================================================

# ── Rate limit zones ─────────────────────────────────────────────────────────
# Defined in the http context normally; keep them here so this file can be
# dropped in without editing nginx.conf. Duplicate zone names across files are
# a hard error, so if you already have them elsewhere, delete these two lines.
limit_req_zone $binary_remote_addr zone=wa_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=wa_auth:10m rate=5r/m;

# Protect the backend's own sub-path from being scraped by mistake.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # ACME challenge must stay on plain HTTP for certbot to renew.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── TLS ──────────────────────────────────────────────────────────────────────
# certbot writes this server block for you. If you are hand-rolling, the block
# below is the minimum; prefer certbot.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploads: invoices and brochures can be several MB, and the campaign
    # importer accepts up to 50MB. Match the backend's JSON limit.
    client_max_body_size 60M;

    # WhatsApp Web session boot pulls a full Chromium build and scans a QR in a
    # browser context. The default 60s read timeout regularly kills that.
    proxy_connect_timeout 180s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;
    proxy_http_version    1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Socket.IO / WebSocket ────────────────────────────────────────────────
    # This is the block people forget. Without Upgrade + Connection headers the
    # socket silently falls back to long-polling and the inbox stops receiving
    # live messages.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001/socket.io/;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A socket with no traffic for 60s (an operator reading a long invoice)
        # is killed by the default 60s read timeout, and the client then
        # reconnects in a loop, burning the Meta rate budget on reconnects.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        proxy_buffering off;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;

        proxy_set_header Upgrade  $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        limit_req zone=wa_api burst=60 nodelay;
        limit_req_status 429;
    }

    # ── Login / OTP: tighter limit than the rest of the API ──────────────────
    location /api/auth/ {
        proxy_pass http://127.0.0.1:5001/api/auth/;

        proxy_set_header Upgrade  $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        limit_req zone=wa_auth burst=10 nodelay;
        limit_req_status 429;
    }

    # ── Uploaded media ───────────────────────────────────────────────────────
    # Served by the backend's express.static, which has NO auth middleware —
    # see backend/scripts/audit-auth.js and DEPLOYMENT.md section 10.
    #
    # Cache-Control is deliberately `private, no-store`, NOT a long public TTL.
    # These are customer invoices, ID documents and brochures. Telling shared
    # proxies and corporate middleboxes to keep a copy for 30 days is a much
    # bigger exposure than the URL being public in the first place. ETag and
    # Last-Modified still give the browser correct revalidation.
    #
    # Add `add_header X-Robots-Tag "noindex, noarchive" always;` if you want to
    # keep filenames out of search indexes.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_set_header Host $host;

        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, noarchive" always;
    }

    # ── Health (no auth, no rate limit) — used by PM2 and uptime monitors ────
    location = /health {
        proxy_pass http://127.0.0.1:5001/health;
        access_log off;
    }

    # ── Everything else ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Upgrade  $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Do not advertise the nginx version.
    server_tokens off;

    access_log /var/log/nginx/whatsapp-crm.access.log;
    error_log  /var/log/nginx/whatsapp-crm.error.log warn;

    # Quiet the log for the polling noise a chatty socket produces, while keeping
    # real 5xx visible.
    log_format wa_main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/whatsapp-crm.access.log wa_main;
}
